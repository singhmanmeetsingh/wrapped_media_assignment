services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: driver_app
      POSTGRES_PASSWORD: driver_app_dev
      POSTGRES_DB: driver_onboarding
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driver_app -d driver_onboarding"]
      interval: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8069:8025"
      - "1026:1025"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://driver_app:driver_app_dev@db:5432/driver_onboarding
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
